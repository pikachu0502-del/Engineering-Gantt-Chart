<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-e40f492f-b638-4e8e-8997-be8b13febb82/styles.css">
<script src="_ds/nocturne-e40f492f-b638-4e8e-8997-be8b13febb82/_ds_bundle.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 白底黑字：把 Nocturne 的色階翻成淺色版，元件與 var() 用法不變 */
  :root, body {
    --color-bg:#fbfbfd; --color-surface:#f2f3f8; --color-text:#1b1d25;
    --color-divider:rgba(27,29,37,0.18); --color-accent:#6455a8;
    --color-neutral-100:#101118; --color-neutral-200:#1b1d25; --color-neutral-300:#343742;
    --color-neutral-400:#4b4e5b; --color-neutral-500:#5f6371; --color-neutral-600:#6e7280;
    --color-neutral-700:#b9bdc9; --color-neutral-800:#dee1eb; --color-neutral-900:#edeff6;
    --color-accent-100:#221d3a; --color-accent-200:#3a3260; --color-accent-300:#4f4581;
    --color-accent-400:#6455a8; --color-accent-500:#7a6dcc; --color-accent-600:#9c92de;
    --color-accent-700:#c3bcee; --color-accent-800:#e2def9; --color-accent-900:#f2f0fd;
    --shadow-sm:0 0 0 1px #dee1eb; --shadow-md:0 0 0 1px #dee1eb, 0 6px 18px rgba(27,29,37,0.10);
  }
  html, body { margin:0; background:var(--color-bg); color:var(--color-text);
    font-family:"Inter","Noto Sans TC",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:var(--color-accent-300); text-decoration:none; }
  a:hover { color:var(--color-accent-200); }
  input, button, select { font-family:inherit; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--color-accent); outline-offset:2px; }
  ::selection { background:var(--color-accent-800); }
  .btn.gt-sm { min-height:0; padding:5px 10px; font-size:12.5px; white-space:nowrap; }
  .btn.gt-ib { min-height:0; width:22px; height:22px; padding:0; font-size:12px; border-color:transparent; }
  .seg-opt.gt-sm { padding:4px 12px; font-size:12.5px; }
  .input.gt-cell { min-height:0; padding:3px 5px; font-size:12.5px; border-color:transparent; background:transparent; border-radius:4px; }
  .input.gt-cell:hover { border-color:var(--color-neutral-800); }
  .input.gt-cell:focus-visible { background:var(--color-neutral-900); }
  .gt-bar { cursor:grab; }
  .gt-bar:active { cursor:grabbing; }
  input[type=date]::-webkit-calendar-picker-indicator { cursor:pointer; opacity:.55; }
</style>
</helmet>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#6455a8"></rect>
    <rect x="30" y="34" width="34" height="7" rx="3.5" fill="#f2f0fd"></rect>
    <rect x="38" y="46.5" width="28" height="7" rx="3.5" fill="#c3bcee"></rect>
    <rect x="46" y="59" width="24" height="7" rx="3.5" fill="#f2f0fd"></rect>
  </svg>
</template>

<div style="height:100vh; display:flex; flex-direction:column; background:var(--color-bg); overflow:hidden">

  <header style="display:flex; align-items:center; gap:var(--space-6); padding:var(--space-4) var(--space-8); border-bottom:1px solid var(--color-neutral-700); flex:none; flex-wrap:wrap">
    <div style="display:flex; align-items:baseline; gap:10px; min-width:0">
      <span style="width:9px; height:9px; border-radius:2px; background:var(--color-accent); display:inline-block"></span>
      <h1 style="font-size:15px; font-weight:500; margin:0; letter-spacing:.02em; white-space:nowrap">工程甘特圖</h1>
      <input class="input gt-cell" value="{{ title }}" onChange="{{ onTitle }}" style="width:220px; font-size:12.5px; color:var(--color-neutral-400)">
    </div>

    <div style="position:relative; flex:none">
      <button class="btn btn-secondary gt-sm" onClick="{{ toggleProjects }}" title="切換／管理專案">▤ {{ currentProjectName }} ▾</button>
      <sc-if value="{{ showProjects }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute; top:100%; left:0; margin-top:6px; z-index:40; width:300px; background:var(--color-bg); border:1px solid var(--color-neutral-700); border-radius:var(--radius-lg); box-shadow:var(--shadow-md); padding:var(--space-4)">
          <div style="font-size:11px; color:var(--color-neutral-500); margin-bottom:var(--space-3); letter-spacing:.04em">專案清單</div>
          <sc-for list="{{ projectRows }}" as="p" hint-placeholder-count="3">
            <div style="display:flex; align-items:center; gap:4px; padding:4px 0; border-bottom:1px solid var(--color-neutral-800)">
              <span style="display:flex; flex-direction:column; flex:none">
                <button class="btn btn-ghost gt-ib" onClick="{{ p.onUp }}" title="上移" style="width:16px; height:14px; font-size:9px; visibility:{{ p.upVis }}">▲</button>
                <button class="btn btn-ghost gt-ib" onClick="{{ p.onDown }}" title="下移" style="width:16px; height:14px; font-size:9px; visibility:{{ p.downVis }}">▼</button>
              </span>
              <input class="input gt-cell" value="{{ p.name }}" onChange="{{ p.onRename }}" style="flex:1; min-width:0; font-weight:{{ p.weight }}; color:{{ p.nameColor }}">
              <button class="btn {{ p.pickCls }} gt-sm" onClick="{{ p.onPick }}" style="flex:none">{{ p.pickLabel }}</button>
              <button class="btn btn-ghost gt-ib" onClick="{{ p.onDelete }}" title="刪除專案" style="flex:none; visibility:{{ p.delVis }}">✕</button>
            </div>
          </sc-for>
          <button class="btn btn-primary gt-sm" onClick="{{ addProject }}" style="margin-top:var(--space-3); width:100%">＋ 新增專案</button>
        </div>
      </sc-if>
    </div>

    <span class="tag tag-accent" title="{{ syncTip }}" style="flex:none; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block">{{ syncLabel }}</span>

    <div class="seg" style="flex:none">
      <label class="seg-opt gt-sm"><input type="radio" name="gt-scale" checked="{{ isDay }}" onChange="{{ setDay }}" style="position:absolute; opacity:0; width:0; height:0">日</label>
      <label class="seg-opt gt-sm"><input type="radio" name="gt-scale" checked="{{ isWeek }}" onChange="{{ setWeek }}" style="position:absolute; opacity:0; width:0; height:0">週</label>
      <label class="seg-opt gt-sm"><input type="radio" name="gt-scale" checked="{{ isMonth }}" onChange="{{ setMonth }}" style="position:absolute; opacity:0; width:0; height:0">月</label>
    </div>

    <div class="seg" style="flex:none">
      <label class="seg-opt gt-sm"><input type="radio" name="gt-time" checked="{{ isCal }}" onChange="{{ setCal }}" style="position:absolute; opacity:0; width:0; height:0">日曆日期</label>
      <label class="seg-opt gt-sm"><input type="radio" name="gt-time" checked="{{ isWd }}" onChange="{{ setWd }}" style="position:absolute; opacity:0; width:0; height:0">工作天</label>
    </div>

    <div style="display:flex; gap:var(--space-2); margin-left:auto; flex-wrap:wrap; justify-content:flex-end">
      <button class="btn btn-primary gt-sm" onClick="{{ openTpl }}">＋ 新增工區（套用樣板）</button>
      <button class="btn btn-secondary gt-sm" onClick="{{ addTask }}">＋ 工項</button>
      <button class="btn btn-secondary gt-sm" onClick="{{ addMilestone }}">◆ 里程碑</button>
      <button class="btn btn-secondary gt-sm" onClick="{{ levelCrews }}" title="同班組的工項自動往後排開，不重疊">班組平準</button>
      <button class="btn btn-secondary gt-sm" onClick="{{ importCsv }}">匯入 CSV</button>
      <button class="btn btn-secondary gt-sm" onClick="{{ exportCsv }}">匯出 CSV</button>
      <button class="btn btn-secondary gt-sm" onClick="{{ exportPng }}">匯出 PNG</button>
      <button class="btn btn-secondary gt-sm" onClick="{{ exportPdf }}">列印 / PDF</button>
      <button class="btn btn-secondary gt-sm" onClick="{{ share }}">共用連結</button>
    </div>
  </header>

  <div style="display:flex; align-items:center; gap:var(--space-6); padding:6px var(--space-8); border-bottom:1px solid var(--color-neutral-700); font-size:11.5px; color:var(--color-neutral-500); flex:none; flex-wrap:wrap">
    <span style="display:flex; align-items:center; gap:6px"><span style="width:22px; height:6px; border-radius:2px; background:var(--color-neutral-200); display:inline-block"></span>大項彙總</span>
    <span style="display:flex; align-items:center; gap:6px"><span style="width:22px; height:6px; border-radius:2px; background:var(--color-accent-600); display:inline-block"></span>工區彙總</span>
    <span style="display:flex; align-items:center; gap:6px"><span style="width:22px; height:8px; border-radius:3px; background:var(--color-accent-500); box-shadow:0 0 0 1px var(--color-accent-200); display:inline-block"></span>要徑</span>
    <span style="display:flex; align-items:center; gap:6px"><span style="width:9px; height:9px; background:var(--color-accent-300); display:inline-block; transform:rotate(45deg)"></span>里程碑</span>
    <sc-for list="{{ crewLegend }}" as="c" hint-placeholder-count="3">
      <span style="display:flex; align-items:center; gap:6px"><span style="width:14px; height:8px; border-radius:3px; display:inline-block; background:{{ c.color }}"></span>{{ c.name }}</span>
    </sc-for>
    <span style="margin-left:auto">{{ summary }}</span>
  </div>

  <div style="display:flex; align-items:center; gap:6px; padding:5px var(--space-8); border-bottom:1px solid var(--color-neutral-700); font-size:11.5px; color:var(--color-neutral-500); flex:none; flex-wrap:wrap">
    <span>顯示欄位（同時套用到出圖）</span>
    <button class="btn gt-sm {{ clsCrew }}" onClick="{{ toggleCrew }}">班組</button>
    <button class="btn gt-sm {{ clsFace }}" onClick="{{ toggleFace }}">工作面</button>
    <button class="btn gt-sm {{ clsStart }}" onClick="{{ toggleStart }}">開始日期</button>
    <button class="btn gt-sm {{ clsDays }}" onClick="{{ toggleDays }}">工期</button>
    <button class="btn gt-sm {{ clsDeps }}" onClick="{{ toggleDeps }}">前置</button>
    <button class="btn gt-sm {{ clsArrow }}" onClick="{{ toggleArrows }}">相依箭頭</button>
  </div>

  <div ref="{{ scrollRef }}" style="flex:1; overflow:auto; position:relative">
    <div style="display:flex; align-items:flex-start; min-width:max-content">

      <div ref="{{ tableRef }}" style="position:sticky; left:0; z-index:3; background:var(--color-bg); border-right:1px solid var(--color-neutral-600); flex:none; width:{{ panelW }}px">
        <div style="position:sticky; top:0; z-index:4; background:var(--color-bg); display:flex; align-items:center; height:52px; border-bottom:1px solid var(--color-neutral-600); font-size:11px; color:var(--color-neutral-500); letter-spacing:.06em; padding:0 var(--space-3)">
          <span style="width:18px; flex:none"></span>
          <span style="width:52px; flex:none">項次</span>
          <span style="flex:1; min-width:250px">工項名稱</span>
          <sc-if value="{{ colCrew }}" hint-placeholder-val="{{ true }}">
            <span style="width:78px; flex:none">班組</span>
          </sc-if>
          <sc-if value="{{ colFace }}" hint-placeholder-val="{{ true }}">
            <span style="width:84px; flex:none">工作面</span>
          </sc-if>
          <sc-if value="{{ colStart }}" hint-placeholder-val="{{ true }}">
            <span style="width:108px; flex:none">{{ startHead }}</span>
          </sc-if>
          <sc-if value="{{ colDays }}" hint-placeholder-val="{{ true }}">
            <span style="width:58px; flex:none; text-align:right">工期</span>
          </sc-if>
          <sc-if value="{{ colDeps }}" hint-placeholder-val="{{ true }}">
            <span style="width:118px; flex:none; text-align:center">前置</span>
          </sc-if>
          <span style="width:86px; flex:none"></span>
        </div>

        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
          <div style="display:flex; align-items:center; height:34px; padding:0 var(--space-3); border-bottom:1px solid var(--color-neutral-700); background:{{ r.rowBg }}; box-shadow:{{ r.dropLine }}">
            <span style="display:flex; align-items:center; width:100%; min-width:0; opacity:{{ r.rowOpacity }}">
              <span onMouseDown="{{ r.onRowDrag }}" title="拖曳調整順序" style="width:18px; flex:none; cursor:grab; text-align:center; font-size:13px; line-height:1; color:var(--color-neutral-700)">≡</span>
              <span style="width:52px; flex:none; font-size:11px; color:var(--color-neutral-600); font-variant-numeric:tabular-nums">{{ r.no }}</span>
              <span style="flex:1; min-width:250px; display:flex; align-items:center; gap:4px; padding-left:{{ r.indent }}px">
                <span style="width:3px; height:16px; border-radius:2px; flex:none; background:{{ r.mark }}"></span>
                <button class="btn btn-ghost gt-ib" onClick="{{ r.onToggle }}" title="折疊／展開" style="flex:none; visibility:{{ r.caretVis }}">{{ r.caret }}</button>
                <input class="input gt-cell" value="{{ r.name }}" onChange="{{ r.onName }}" style="color:{{ r.nameColor }}; font-weight:{{ r.nameWeight }}">
              </span>
              <sc-if value="{{ colCrew }}" hint-placeholder-val="{{ true }}">
              <span style="width:78px; flex:none; display:flex; align-items:center; gap:4px">
                <span style="width:7px; height:7px; border-radius:2px; flex:none; background:{{ r.crewColor }}"></span>
                <input class="input gt-cell" value="{{ r.crew }}" onChange="{{ r.onCrew }}" placeholder="—">
              </span>
              </sc-if>
              <sc-if value="{{ colFace }}" hint-placeholder-val="{{ true }}">
              <span style="width:84px; flex:none"><input class="input gt-cell" value="{{ r.face }}" onChange="{{ r.onFace }}" placeholder="—" style="color:var(--color-neutral-400)"></span>
              </sc-if>
              <sc-if value="{{ colStart }}" hint-placeholder-val="{{ true }}">
              <span style="width:108px; flex:none">
                <sc-if value="{{ isCal }}" hint-placeholder-val="{{ true }}">
                  <input class="input gt-cell" type="text" key="{{ r.dateKey }}" defaultValue="{{ r.start }}" onBlur="{{ r.onStartText }}" onKeyDown="{{ r.onStartKey }}" disabled="{{ r.locked }}" placeholder="2026-08-22" title="可直接打字：2026-08-22、2026/8/22、20260822，或民國 115/8/22" style="font-variant-numeric:tabular-nums">
                </sc-if>
                <sc-if value="{{ isWd }}" hint-placeholder-val="{{ false }}">
                  <input class="input gt-cell" type="number" min="1" value="{{ r.startDay }}" onChange="{{ r.onStartDay }}" disabled="{{ r.locked }}" style="text-align:right; font-variant-numeric:tabular-nums">
                </sc-if>
              </span>
              </sc-if>
              <sc-if value="{{ colDays }}" hint-placeholder-val="{{ true }}">
              <span style="width:58px; flex:none"><input class="input gt-cell" type="number" min="0" value="{{ r.days }}" onChange="{{ r.onDays }}" style="text-align:right" disabled="{{ r.lockDays }}"></span>
              </sc-if>
              <sc-if value="{{ colDeps }}" hint-placeholder-val="{{ true }}">
              <span style="width:118px; flex:none">
                <select class="input gt-cell" value="{{ r.depPick }}" onChange="{{ r.onDepPick }}" title="{{ r.depTip }}" style="text-align:left; color:var(--color-neutral-400); cursor:pointer">
                  <option value="">{{ r.depsLabel }}</option>
                  <sc-for list="{{ r.depOptions }}" as="o" hint-placeholder-count="4">
                    <option value="{{ o.id }}">{{ o.label }}</option>
                  </sc-for>
                </select>
              </span>
              </sc-if>
              <span style="width:86px; flex:none; display:flex; gap:2px; justify-content:flex-end">
                <button class="btn btn-ghost gt-ib" onClick="{{ r.onOut }}" title="升一層">⇤</button>
                <button class="btn btn-ghost gt-ib" onClick="{{ r.onIn }}" title="降一層">⇥</button>
                <button class="btn btn-ghost gt-ib" onClick="{{ r.onFlag }}" title="切換里程碑" style="color:{{ r.flagColor }}">◆</button>
                <button class="btn btn-ghost gt-ib" onClick="{{ r.onDelete }}" title="刪除（含其下層）">✕</button>
              </span>
            </span>
          </div>
        </sc-for>

        <div style="height:34px; display:flex; align-items:center; padding:0 var(--space-3); font-size:11.5px; color:var(--color-neutral-700)">在右側空白列拖曳即可畫出新工項 →</div>
      </div>

      <div style="flex:none; position:relative">
        <div style="position:sticky; top:0; z-index:2; background:var(--color-bg); border-bottom:1px solid var(--color-neutral-600); height:52px; width:{{ chartW }}px">
          <sc-for list="{{ topCells }}" as="c" hint-placeholder-count="3">
            <div style="position:absolute; top:0; height:26px; display:flex; align-items:center; padding-left:8px; font-size:11px; letter-spacing:.05em; color:var(--color-neutral-400); border-left:1px solid var(--color-neutral-600); box-sizing:border-box; overflow:hidden; white-space:nowrap; left:{{ c.left }}px; width:{{ c.width }}px">{{ c.label }}</div>
          </sc-for>
          <sc-for list="{{ botCells }}" as="c" hint-placeholder-count="14">
            <div style="position:absolute; top:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-variant-numeric:tabular-nums; box-sizing:border-box; overflow:hidden; border-left:1px solid var(--color-neutral-700); left:{{ c.left }}px; width:{{ c.width }}px; color:{{ c.color }}; background:{{ c.bg }}">{{ c.label }}</div>
          </sc-for>
        </div>

        <div ref="{{ gridRef }}" onMouseDown="{{ onGridDown }}" style="position:relative; width:{{ chartW }}px; height:{{ chartH }}px">
          <sc-for list="{{ botCells }}" as="c" hint-placeholder-count="14">
            <div style="position:absolute; top:0; bottom:0; width:1px; background:{{ c.line }}; left:{{ c.left }}px"></div>
          </sc-for>
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
            <div style="position:absolute; left:0; right:0; height:34px; border-bottom:1px solid var(--color-neutral-700); top:{{ r.top }}px; background:{{ r.rowBg }}"></div>
          </sc-for>

          <div style="position:absolute; top:0; bottom:0; width:1px; background:var(--color-accent-400); opacity:.75; left:{{ todayX }}px"></div>

          <sc-if value="{{ colArrows }}" hint-placeholder-val="{{ true }}">
          <svg width="{{ chartW }}" height="{{ chartH }}" style="position:absolute; inset:0; pointer-events:none; overflow:visible">
            <sc-for list="{{ arrows }}" as="a" hint-placeholder-count="4">
              <path d="{{ a.d }}" fill="none" stroke="{{ a.color }}" stroke-width="1.25"></path>
            </sc-for>
            <sc-for list="{{ arrows }}" as="a" hint-placeholder-count="4">
              <polygon points="{{ a.head }}" fill="{{ a.color }}"></polygon>
            </sc-for>
          </svg>
          </sc-if>

          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
            <div style="position:absolute; height:34px; display:flex; align-items:center; top:{{ r.top }}px; left:{{ r.left }}px">
              <sc-if value="{{ r.isRollup }}" hint-placeholder-val="{{ false }}">
                <div title="{{ r.tip }}" style="height:{{ r.rollH }}px; border-radius:2px; background:{{ r.rollTrack }}; width:{{ r.width }}px"></div>
              </sc-if>
              <sc-if value="{{ r.milestone }}" hint-placeholder-val="{{ false }}">
                <div class="gt-bar" onMouseDown="{{ r.onMove }}" title="{{ r.tip }}" style="width:15px; height:15px; transform:rotate(45deg); border-radius:2px; background:{{ r.color }}"></div>
              </sc-if>
              <sc-if value="{{ r.isBar }}" hint-placeholder-val="{{ true }}">
                <div class="gt-bar" onMouseDown="{{ r.onMove }}" title="{{ r.tip }}" style="position:relative; height:17px; border-radius:4px; display:flex; align-items:center; width:{{ r.width }}px; background:{{ r.color }}; box-shadow:{{ r.glow }}">
                  <div onMouseDown="{{ r.onResizeL }}" style="position:absolute; left:0; top:0; bottom:0; width:7px; cursor:ew-resize"></div>
                  <div onMouseDown="{{ r.onResizeR }}" style="position:absolute; right:0; top:0; bottom:0; width:7px; cursor:ew-resize"></div>
                </div>
              </sc-if>
              <span style="margin-left:8px; font-size:11.5px; white-space:nowrap; pointer-events:none; color:{{ r.labelColor }}">{{ r.barLabel }}</span>
            </div>
          </sc-for>

          <div style="position:absolute; height:17px; border-radius:4px; border:1px dashed var(--color-accent-400); background:color-mix(in srgb, var(--color-accent) 18%, transparent); pointer-events:none; display:{{ ghostShow }}; top:{{ ghostTop }}px; left:{{ ghostLeft }}px; width:{{ ghostW }}px"></div>
        </div>
      </div>
    </div>
  </div>

  <sc-if value="{{ showTpl }}" hint-placeholder-val="{{ false }}">
    <div class="dialog-backdrop" style="position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; background:rgba(27,29,37,0.35)">
      <div class="dialog" style="width:560px; max-width:92vw; background:var(--color-bg); box-shadow:var(--shadow-md); border-radius:var(--radius-lg); padding:var(--space-8)">
        <div class="dialog-title" style="font-size:14px; margin-bottom:4px">工序樣板</div>
        <div style="font-size:12px; color:var(--color-neutral-500); margin-bottom:var(--space-6)">每個工區重複的標準工序；新增工區時會依序建立並自動前後相接。</div>
        <div class="dialog-body">
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:var(--space-4)">
            <input class="input" value="{{ newZoneName }}" onChange="{{ onNewZoneName }}" placeholder="工區名稱，例如 工區 6" style="flex:1">
            <input class="input" value="{{ newZoneCrew }}" onChange="{{ onNewZoneCrew }}" placeholder="班組" style="width:110px">
          </div>
          <sc-for list="{{ steps }}" as="s" hint-placeholder-count="5">
            <div style="display:flex; gap:8px; align-items:center; margin-bottom:6px">

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
const DAY = 86400000;
const ROW = 34;
const PX = { day: 34, week: 11.5, month: 3.8 };
// 班組色：同明度／同彩度、僅換色相，與 Nocturne 主色同調
const CREWC = ["#7a6dcc", "#3f8a78", "#b07a3a", "#a85c86", "#4a7fb0", "#78873c", "#9c5f52"];
const DEFAULT_STEPS = [
  { name: "放樣、開挖擋土", days: 10 },
  { name: "基礎澆置", days: 10 },
  { name: "槽體固定與配管安裝", days: 20 },
  { name: "設備安裝與清水試車", days: 15 },
  { name: "槽體回填、餘方處理、現場復舊", days: 5 },
];

class Component extends DCLogic {
  state = {
    title: "淨化槽工程 — 施工預定進度表",
    scale: "day",
    timeMode: "date",
    tasks: [],
    steps: DEFAULT_STEPS.slice(),
    collapsed: {},
    newZoneName: "",
    newZoneCrew: "",
    cols: { crew: true, face: true, start: true, days: true, deps: true, arrows: true },
    projects: [], currentProjectId: null, showProjects: false,
    showTpl: false,
    ghost: null,
  };

  // ---- date helpers ----
  s2d(s) { const p = String(s).split("-").map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
  d2s(ms) { return new Date(ms).toISOString().slice(0, 10); }
  md(ms) { const d = new Date(ms); return (d.getUTCMonth() + 1) + "/" + d.getUTCDate(); }

  // ---- WBS：0 大項 / 1 工區 / 2 工項 ----
  struct(tasks) {
    const label = {}, kids = {}, parent = {}, lv = {};
    let c0 = 0, c1 = 0, c2 = 0, top = null, mid = null;
    tasks.forEach(t => {
      let L = Math.min(2, Math.max(0, t.level || 0));
      if (L === 2 && !mid) L = top ? 1 : 0;
      if (L === 1 && !top) L = 0;
      kids[t.id] = [];
      lv[t.id] = L;
      if (L === 0) { c0++; c1 = 0; c2 = 0; top = t.id; mid = null; label[t.id] = String(c0); }
      else if (L === 1) { c1++; c2 = 0; mid = t.id; parent[t.id] = top; label[t.id] = label[top] + "." + c1; }
      else { c2++; parent[t.id] = mid; label[t.id] = label[mid] + "." + c2; }
    });
    tasks.forEach(t => { const p = parent[t.id]; if (p) kids[p].push(t); });
    const leaves = id => {
      const k = kids[id] || [];
      if (!k.length) return [];
      let out = [];
      k.forEach(c => { const sub = leaves(c.id); out = out.concat(sub.length ? sub : [c]); });
      return out;
    };
    return { label: label, kids: kids, parent: parent, lv: lv, leaves: leaves };
  }
  hidden(id, st) {
    let p = st.parent[id];
    while (p) { if (this.state.collapsed[p]) return true; p = st.parent[p]; }
    return false;
  }
  dispList(m) {
    const st = this.struct(m.tasks);
    const out = [];
    m.tasks.forEach(t => { if (!this.hidden(t.id, st)) out.push({ kind: "t", t: t }); });
    return out;
  }
  roll(list) {
    let s = Infinity, e = -Infinity, w = 0, p = 0;
    list.forEach(t => {
      const st = this.s2d(t.start), en = st + Math.max(t.days, 0) * DAY;
      s = Math.min(s, st); e = Math.max(e, en);
      w += Math.max(t.days, 0); p += Math.max(t.days, 0) * Math.max(0, Math.min(100, t.progress || 0));
    });
    if (!isFinite(s)) { s = Date.now(); e = s; }
    return { start: s, end: e, days: Math.round((e - s) / DAY), progress: w ? Math.round(p / w) : 0 };
  }
  crewColor(name) {
    const n = String(name || "").trim();
    if (!n) return "transparent";
    let h = 0; for (let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 997;
    return CREWC[h % CREWC.length];
  }

  seed() {
    const base = this.s2d(this.d2s(Date.now() - 20 * DAY));
    // [名稱, 層級, 工期, 前置(序號), 班組, 工作面]
    const raw = [
      ["前置作業", 0, 0, [], "", ""],
      ["行政與備料", 1, 0, [], "管理", ""],
      ["提送計畫書及材料送審", 2, 30, [], "管理", "全區"],
      ["機具動員、材料進場檢試驗", 2, 15, [3], "管理", "全區"],
      ["材料設備交貨期", 2, 30, [4], "管理", "全區"],
      ["淨化槽主體工程", 0, 0, [], "", ""],
      ["工區 1~3", 1, 0, [], "甲班", ""],
      ["放樣、開挖擋土", 2, 15, [5], "甲班", "工區1~3"],
      ["基礎澆置（含部份場鑄施工）", 2, 15, [8], "甲班", "工區1~3"],
      ["槽體固定與配管安裝", 2, 30, [9], "甲班", "工區1~3"],
      ["設備安裝與清水試車", 2, 20, [10], "甲班", "工區1~3"],
      ["槽體回填、餘方處理、現場復舊", 2, 5, [11], "甲班", "工區1~3"],
      ["工區 4", 1, 0, [], "乙班", ""],
      ["放樣、開挖擋土", 2, 10, [5], "乙班", "工區4"],
      ["基礎澆置", 2, 10, [14], "乙班", "工區4"],
      ["槽體固定與配管安裝", 2, 20, [15], "乙班", "工區4"],
      ["設備安裝與清水試車", 2, 15, [16], "乙班", "工區4"],
      ["槽體回填、餘方處理、現場復舊", 2, 5, [17], "乙班", "工區4"],
      ["工區 5", 1, 0, [], "甲班", ""],
      ["放樣、開挖擋土", 2, 15, [12], "甲班", "工區5"],
      ["基礎澆置", 2, 15, [20], "甲班", "工區5"],
      ["槽體固定與配管安裝", 2, 30, [21], "甲班", "工區5"],
      ["設備安裝與清水試車", 2, 20, [22], "甲班", "工區5"],
      ["槽體回填、餘方處理、現場復舊", 2, 5, [23], "甲班", "工區5"],
      ["用戶接管主體工程", 0, 0, [], "", ""],
      ["工區 9", 1, 0, [], "丙班", ""],
      ["障礙拆除清理、放樣、開挖擋土", 2, 5, [24], "丙班", "工區9"],
      ["管線埋設", 2, 15, [27], "丙班", "工區9"],
      ["既有化糞池廢除、消毒與回填", 2, 5, [28], "丙班", "工區9"],
      ["試水與管線回填", 2, 5, [29], "丙班", "工區9"],
      ["雜項作業", 0, 0, [], "", ""],
      ["竣工與撤收", 1, 0, [], "管理", ""],
      ["竣工資料彙整、工程撤收、環境整理", 2, 20, [30], "管理", "全區"],
      ["全案竣工", 2, 0, [33], "管理", "全區"],
    ];
    const out = [];
    raw.forEach((r, i) => {
      const deps = r[3].map(n => "t" + n);
      let st = base;
      deps.forEach(d => { const p = out.find(o => o.id === d); if (p) st = Math.max(st, this.s2d(p.start) + p.days * DAY); });
      out.push({
        id: "t" + (i + 1), name: r[0], level: r[1], days: r[2], deps: deps,
        crew: r[4], face: r[5], progress: 0, start: this.d2s(st),
        milestone: r[1] === 2 && r[2] === 0,
      });
    });
    return out;
  }

  // ---- 多專案管理（存在本機） ----
  projectsKey() { return "gantt-tc-v2-projects"; }
  projKey(id) { return "gantt-tc-v2-proj-" + id; }
  readProj(id) { try { const s = localStorage.getItem(this.projKey(id)); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  writeProj(id, data) { try { localStorage.setItem(this.projKey(id), JSON.stringify(data)); } catch (e) {} }
  writeProjectsList(list) { try { localStorage.setItem(this.projectsKey(), JSON.stringify(list)); } catch (e) {} }
  saveCurrent() {
    if (!this.state.currentProjectId) return;
    this.writeProj(this.state.currentProjectId, { title: this.state.title, tasks: this.state.tasks, steps: this.state.steps });
  }
  loadProjects() {
    let list = [];
    try { const s = localStorage.getItem(this.projectsKey()); if (s) list = JSON.parse(s) || []; } catch (e) { list = []; }
    if (!list.length) {
      let old = null;
      try { const s = localStorage.getItem("gantt-tc-v2"); if (s) old = JSON.parse(s); } catch (e) { old = null; }
      const id = "p" + Date.now();
      const data = old && old.tasks && old.tasks.length ? old : { title: this.state.title, tasks: this.seed(), steps: this.state.steps };
      list = [{ id: id, name: data.title || "示範專案" }];
      this.writeProj(id, data);
      this.writeProjectsList(list);
    }
    const cur = list[0];
    const data = this.readProj(cur.id) || { title: cur.name, tasks: this.seed(), steps: this.state.steps };
    this.setState({
      projects: list, currentProjectId: cur.id,
      title: data.title || cur.name, tasks: this.fix(data.tasks || []), steps: data.steps || this.state.steps,
    });
  }
  switchProject(id) {
    if (id === this.state.currentProjectId) { this.setState({ showProjects: false }); return; }
    this.saveCurrent();
    const proj = this.state.projects.find(p => p.id === id);
    const data = this.readProj(id) || { title: proj ? proj.name : "專案", tasks: [], steps: DEFAULT_STEPS.slice() };
    this.setState({
      currentProjectId: id, title: data.title || (proj ? proj.name : "專案"),
      tasks: this.fix(data.tasks || []), steps: data.steps || DEFAULT_STEPS.slice(),
      collapsed: {}, showProjects: false, dropAt: null, dragId: null, ghost: null,
    });
  }
  renameProject(id, name) {
    this.setState(s => {
      const list = s.projects.map(p => p.id === id ? Object.assign({}, p, { name: name }) : p);
      this.writeProjectsList(list);
      const patch = { projects: list };
      if (id === s.currentProjectId) patch.title = name;
      else {
        const data = this.readProj(id);
        if (data) this.writeProj(id, Object.assign({}, data, { title: name }));
      }
      return patch;
    });
  }
  moveProject(id, dir) {
    this.setState(s => {
      const list = s.projects.slice();
      const i = list.findIndex(p => p.id === id), j = i + dir;
      if (i < 0 || j < 0 || j >= list.length) return {};
      const tmp = list[i]; list[i] = list[j]; list[j] = tmp;
      this.writeProjectsList(list);
      return { projects: list };
    });
  }
  deleteProject(id) {
    if (this.state.projects.length <= 1) return;
    const list = this.state.projects.filter(p => p.id !== id);
    try { localStorage.removeItem(this.projKey(id)); } catch (e) {}
    this.writeProjectsList(list);
    if (id !== this.state.currentProjectId) { this.setState({ projects: list }); return; }
    const next = list[0];
    const data = this.readProj(next.id) || { title: next.name, tasks: [], steps: DEFAULT_STEPS.slice() };
    this.setState({
      projects: list, currentProjectId: next.id, title: data.title || next.name,
      tasks: this.fix(data.tasks || []), steps: data.steps || DEFAULT_STEPS.slice(), collapsed: {},
    });
  }
  addProject() {
    const id = "p" + Date.now();
    const name = "新專案 " + (this.state.projects.length + 1);
    const data = { title: name, tasks: [], steps: DEFAULT_STEPS.slice() };
    this.saveCurrent();
    this.writeProj(id, data);
    const list = this.state.projects.concat([{ id: id, name: name }]);
    this.writeProjectsList(list);
    this.setState({ projects: list, currentProjectId: id, title: name, tasks: [], steps: data.steps, collapsed: {}, showProjects: false });
  }

  componentDidMount() {
    this.clientId = Math.random().toString(36).slice(2, 10);
    this.loadProjects();
    this._mm = e => this.onMove(e); this._mu = e => this.onUp(e);
    window.addEventListener("mousemove", this._mm); window.addEventListener("mouseup", this._mu);
    this.initSync();
  }
  componentWillUnmount() {
    window.removeEventListener("mousemove", this._mm); window.removeEventListener("mouseup", this._mu);
    if (this.presenceRef) this.presenceRef.remove();
    if (this.docRef) this.docRef.off();
  }
  componentDidUpdate() {
    if (!this.state.tasks.length) return;
    this.saveCurrent();
    if (this._fromRemote) { this._fromRemote = false; return; }
    this.push();
  }

  // ---- Firebase 即時協作 ----
  initSync(n) {
    if (!window.firebase || !firebase.database) {
      if ((n || 0) > 30) return this.setState({ sync: "off" });
      return setTimeout(() => this.initSync((n || 0) + 1), 300);
    }
    try {
      if (!firebase.apps.length) firebase.initializeApp({
        apiKey: "AIzaSyCAVM24doMGu3jzZiikdjaSUS1Zz8W43hw",
        authDomain: "engineering-gantt-chart.firebaseapp.com",
        databaseURL: "https://engineering-gantt-chart-default-rtdb.firebaseio.com",
        projectId: "engineering-gantt-chart",
        storageBucket: "engineering-gantt-chart.firebasestorage.app",
        messagingSenderId: "841300096411",
        appId: "1:841300096411:web:5538cf8c8c32bfba6e9d3e",
      });
      const db = firebase.database();
      const hit = location.hash.match(/r=([A-Za-z0-9_-]+)/);
      this.room = hit ? hit[1] : Math.random().toString(36).slice(2, 8).toUpperCase();
      if (!hit) { try { history.replaceState(null, "", location.pathname + location.search + "#r=" + this.room); } catch (e) {} }
      this.docRef = db.ref("gantt/" + this.room + "/doc");
      this.docRef.on("value", snap => {
        const v = snap.val();
        this.setState({ sync: "live" });
        if (!v) { this.push(true); return; }
        if (v.by === this.clientId) return;
        this._fromRemote = true;
        this.setState({ tasks: this.fix(v.tasks || []), title: v.title || this.state.title, steps: v.steps || this.state.steps });
      }, () => this.setState({ sync: "off" }));
      this.presenceRef = db.ref("gantt/" + this.room + "/presence/" + this.clientId);
      this.presenceRef.set(Date.now());
      this.presenceRef.onDisconnect().remove();
      db.ref("gantt/" + this.room + "/presence").on("value", s => this.setState({ peers: s.numChildren() }));
    } catch (e) { this.setState({ sync: "off" }); }
  }
  push(now) {
    if (!this.docRef) return;
    clearTimeout(this._pt);
    const send = () => this.docRef.set({
      title: this.state.title, tasks: this.state.tasks, steps: this.state.steps,
      by: this.clientId, at: Date.now(),
    }).catch(() => this.setState({ sync: "off" }));
    if (now) send(); else this._pt = setTimeout(send, 350);
  }

  // 接受 2026-08-22 / 2026/8/22 / 20260822 / 民國 115.8.22
  parseDate(v) {
    const s = String(v || "").trim().replace(/[年月.]/g, "/").replace(/日/g, "").replace(/\s/g, "");
    let y, mo, d, m;
    if ((m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})\/?$/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    else if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    else if ((m = s.match(/^(\d{2,3})[-/](\d{1,2})[-/](\d{1,2})\/?$/))) { y = +m[1] + 1911; mo = +m[2]; d = +m[3]; }
    else return null;
    if (!(y >= 1900 && y <= 2200) || !(mo >= 1 && mo <= 12) || !(d >= 1 && d <= 31)) return null;
    const iso = new Date(Date.UTC(y, mo - 1, d));
    if (iso.getUTCMonth() !== mo - 1) return null;
    return iso.toISOString().slice(0, 10);
  }
  // 修掉異常日期（例如年份只打兩碼變成 0020 年）
  fix(tasks) {
    const FLOOR = Date.UTC(1900, 0, 1), today = this.d2s(Date.now());
    return (tasks || []).map(t => {
      const s = this.s2d(t.start);
      if (s > FLOOR) return t;
      return Object.assign({}, t, { start: today });
    });
  }
  toggleCol(k) {
    this.setState(s => {
      const c = Object.assign({}, s.cols); c[k] = !c[k]; return { cols: c };
    });
  }
  setTasks(fn) { this.setState(s => ({ tasks: fn(s.tasks.slice()) })); }
  patch(id, obj) { this.setTasks(ts => ts.map(t => t.id === id ? Object.assign({}, t, obj) : t)); }

  model() {
    const tasks = this.state.tasks;
    const byId = {}; tasks.forEach(t => byId[t.id] = t);
    const st = this.struct(tasks);
    const leaf = t => (st.kids[t.id] || []).length === 0;
    const ef = t => this.s2d(t.start) + Math.max(t.days, 0) * DAY;
    const FLOOR = Date.UTC(1900, 0, 1);
    let min = Infinity, max = -Infinity;
    tasks.forEach(t => {
      if (!leaf(t)) return;
      const s = this.s2d(t.start);
      if (!(s > FLOOR)) return; // 忽略異常日期，避免時間軸被拉到幾千天
      min = Math.min(min, s); max = Math.max(max, ef(t));
    });
    if (!isFinite(min)) { min = this.s2d(this.d2s(Date.now())); max = min + 30 * DAY; }
    const succ = {};
    tasks.forEach(t => (t.deps || []).forEach(d => { if (byId[d]) (succ[d] = succ[d] || []).push(t.id); }));
    const crit = {};
    tasks.forEach(t => {
      if (!leaf(t)) { crit[t.id] = false; return; }
      const s = succ[t.id];
      const lf = s && s.length ? Math.min.apply(null, s.map(id => this.s2d(byId[id].start))) : max;
      crit[t.id] = (lf - ef(t)) < 0.5 * DAY;
    });
    const pad = this.state.scale === "day" ? 3 : this.state.scale === "week" ? 7 : 20;
    return { tasks: tasks, byId: byId, st: st, crit: crit, min: min, max: max, t0: min - pad * DAY, t1: max + pad * DAY };
  }

  cols(m, px) {
    const top = [], bot = [], sc = this.state.scale, wd = this.state.timeMode === "wd";
    const x = ms => (ms - m.t0) / DAY * px;
    const dayNo = ms => Math.round((ms - m.min) / DAY) + 1;
    if (sc === "month") {
      let d = new Date(m.t0); let cur = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
      let yStart = cur, yLabel = new Date(cur).getUTCFullYear();
      while (cur < m.t1) {
        const nd = new Date(cur); const nxt = Date.UTC(nd.getUTCFullYear(), nd.getUTCMonth() + 1, 1);
        bot.push({ left: x(cur), width: (nxt - cur) / DAY * px, label: wd ? String(Math.max(1, dayNo(cur))) : (nd.getUTCMonth() + 1) + "月", color: "var(--color-neutral-400)", bg: "transparent", line: "var(--color-neutral-900)" });
        if (nd.getUTCFullYear() !== yLabel) { top.push({ left: x(yStart), width: x(cur) - x(yStart), label: yLabel + " 年" }); yStart = cur; yLabel = nd.getUTCFullYear(); }
        cur = nxt;
      }
      top.push({ left: x(yStart), width: x(cur) - x(yStart), label: yLabel + " 年" });
    } else {
      const step = sc === "day" ? 1 : 7;
      let cur = m.t0;
      if (sc === "week") { const w = (new Date(cur).getUTCDay() + 6) % 7; cur -= w * DAY; }
      let mStart = cur, mLabel = new Date(cur).getUTCMonth();
      const today = this.s2d(this.d2s(Date.now()));
      let k = 0;
      while (cur < m.t1 && k < 2500) {
        const d = new Date(cur); const dow = d.getUTCDay(); const we = dow === 0 || dow === 6;
        const n = dayNo(cur);
        let lab;
        if (wd) lab = (sc === "day" ? (n % 5 === 0 || n === 1) : true) && n > 0 ? String(n) : "";
        else lab = sc === "day" ? String(d.getUTCDate()) : this.md(cur);
        bot.push({
          left: x(cur), width: step * px, label: lab,
          color: cur === today ? "var(--color-accent-200)" : we ? "var(--color-neutral-700)" : "var(--color-neutral-400)",
          bg: we && sc === "day" ? "color-mix(in srgb, var(--color-neutral-900) 70%, transparent)" : "transparent",
          line: "var(--color-neutral-700)",
        });
        if (d.getUTCMonth() !== mLabel) {
          top.push({ left: x(mStart), width: x(cur) - x(mStart), label: new Date(mStart).getUTCFullYear() + " / " + (mLabel + 1) + " 月" });
          mStart = cur; mLabel = d.getUTCMonth();
        }
        cur += step * DAY; k++;
      }
      top.push({ left: x(mStart), width: x(cur) - x(mStart), label: new Date(mStart).getUTCFullYear() + " / " + (mLabel + 1) + " 月" });
    }
    return { top: top, bot: bot, width: Math.max(600, x(sc === "month" ? m.t1 + 31 * DAY : m.t1)) };
  }

  // ---- 拖曳 ----
  startDrag(e, id, mode) {
    e.preventDefault(); e.stopPropagation();
    const t = this.state.tasks.find(x => x.id === id);
    this.drag = { id: id, mode: mode, x0: e.clientX, start0: this.s2d(t.start), days0: t.days };
  }
  startRowDrag(e, id) {
    e.preventDefault(); e.stopPropagation();
    this.rowDrag = { id: id };
    this.setState({ dragId: id, dropAt: null });
  }
  reorder(id, at) {
    const tasks = this.state.tasks.slice();
    const st = this.struct(tasks);
    const self = tasks.filter(t => t.id === id);
    const sub = [];
    (st.kids[id] || []).forEach(k => { sub.push(k); (st.kids[k.id] || []).forEach(g => sub.push(g)); });
    const block = self.concat(sub);
    const rest = tasks.filter(t => block.indexOf(t) < 0);
    const target = (this._disp || [])[at];
    let idx = rest.length;
    if (target && target.kind === "t") { const k = rest.indexOf(target.t); if (k >= 0) idx = k; }
    this.setState({ tasks: rest.slice(0, idx).concat(block, rest.slice(idx)) });
  }
  onMove(e) {
    const px = PX[this.state.scale];
    if (this.rowDrag) {
      if (!this.tableEl) return;
      const box = this.tableEl.getBoundingClientRect();
      let at = Math.round((e.clientY - box.top - 52) / ROW);
      at = Math.max(0, Math.min(this._rows || 0, at));
      if (at !== this.state.dropAt) this.setState({ dropAt: at });
      return;
    }
    if (this.drag) {
      const dd = Math.round((e.clientX - this.drag.x0) / px);
      const d = this.drag;
      if (d.mode === "move") this.patch(d.id, { start: this.d2s(d.start0 + dd * DAY) });
      else if (d.mode === "r") this.patch(d.id, { days: Math.max(1, d.days0 + dd) });
      else { const nd = Math.max(1, d.days0 - dd); this.patch(d.id, { start: this.d2s(d.start0 + (d.days0 - nd) * DAY), days: nd }); }
    } else if (this.state.ghost) {
      this.setState({ ghost: Object.assign({}, this.state.ghost, { x1: e.clientX }) });
    }
  }
  onUp() {
    if (this.rowDrag) {
      const id = this.rowDrag.id, at = this.state.dropAt;
      this.rowDrag = null;
      if (at != null) this.reorder(id, at);
      this.setState({ dragId: null, dropAt: null });
      return;
    }
    this.drag = null;
    const g = this.state.ghost;
    if (g) {
      const px = PX[this.state.scale];
      const a = Math.min(g.x0, g.x1), b = Math.max(g.x0, g.x1);
      const days = Math.max(1, Math.round((b - a) / px));
      const start = g.t0 + Math.floor((a - g.originX) / px) * DAY;
      this.setState({ ghost: null });
      this.setTasks(ts => ts.concat([{ id: "t" + Date.now(), name: "新工項", level: 2, crew: "", face: "", progress: 0, start: this.d2s(start), days: days, deps: [], milestone: false }]));
    }
  }
  onGridDown(e) {
    const m = this.model();
    const box = this.gridEl.getBoundingClientRect();
    const n = this._rows == null ? 0 : this._rows;
    if (Math.floor((e.clientY - box.top) / ROW) < n) return;
    this.setState({ ghost: { x0: e.clientX, x1: e.clientX, originX: box.left, t0: m.t0, top: n * ROW } });
  }

  // ---- 動作 ----
  addTask(ms) {
    const ts = this.state.tasks;
    const last = ts[ts.length - 1];
    const start = last ? this.d2s(this.s2d(last.start) + Math.max(last.days, 1) * DAY) : this.d2s(Date.now());
    this.setTasks(t => t.concat([{
      id: "t" + Date.now(), name: ms ? "里程碑" : "新工項", level: last ? Math.min(2, last.level || 0) : 0,
      crew: last ? (last.crew || "") : "", face: last ? (last.face || "") : "", progress: 0,
      start: start, days: ms ? 0 : 5, deps: last ? [last.id] : [], milestone: !!ms,
    }]));
  }
  addZone() {
    const ts = this.state.tasks.slice();
    const crew = (this.state.newZoneCrew || "").trim();
    const name = (this.state.newZoneName || "").trim() || "新工區";
    // 接在同班組最後一項之後；沒有同班組就接在全案最後
    let anchor = null;
    ts.forEach(t => {
      if ((t.days || 0) <= 0) return;
      if (crew && String(t.crew || "").trim() !== crew) return;
      if (!anchor || this.s2d(t.start) + t.days * DAY > this.s2d(anchor.start) + anchor.days * DAY) anchor = t;
    });
    let cursor = anchor ? this.s2d(anchor.start) + Math.max(anchor.days, 0) * DAY : this.s2d(this.d2s(Date.now()));
    const stamp = Date.now();
    const zone = { id: "z" + stamp, name: name, level: 1, crew: crew, face: "", progress: 0, start: this.d2s(cursor), days: 0, deps: [], milestone: false };
    const out = [zone];
    let prev = anchor ? anchor.id : null;
    this.state.steps.forEach((s, i) => {
      const id = "s" + stamp + "-" + i;
      out.push({
        id: id, name: s.name, level: 2, crew: crew, face: name, progress: 0,
        start: this.d2s(cursor), days: Math.max(0, parseInt(s.days, 10) || 0),
        deps: prev ? [prev] : [], milestone: false,
      });
      cursor += Math.max(0, parseInt(s.days, 10) || 0) * DAY;
      prev = id;
    });
    this.setState({ tasks: ts.concat(out), showTpl: false, newZoneName: "", newZoneCrew: crew });
  }
  levelCrews() {
    const ts = this.state.tasks.map(t => Object.assign({}, t));
    const st = this.struct(ts);
    const byId = {}; ts.forEach(t => byId[t.id] = t);
    const leaves = ts.filter(t => (st.kids[t.id] || []).length === 0);
    const endOf = id => {
      const p = byId[id]; if (!p) return -Infinity;
      const k = st.kids[id] || [];
      if (k.length) return this.roll(st.leaves(id)).end;
      return this.s2d(p.start) + Math.max(p.days, 0) * DAY;
    };
    const shift = (id, delta) => {
      const lv = st.leaves(id);
      (lv.length ? lv : [byId[id]]).forEach(t => { t.start = this.d2s(this.s2d(t.start) + delta); });
    };
    for (let pass = 0; pass < 6; pass++) {
      // 大項／工區自身的前置：整組往後平移
      ts.forEach(t => {
        const k = st.kids[t.id] || [];
        if (!k.length || !(t.deps || []).length) return;
        const r = this.roll(st.leaves(t.id));
        let need = r.start;
        (t.deps || []).forEach(d => { need = Math.max(need, endOf(d)); });
        if (need > r.start) shift(t.id, need - r.start);
      });
      leaves.forEach(t => {
        let s = this.s2d(t.start);
        (t.deps || []).forEach(d => { s = Math.max(s, endOf(d)); });
        t.start = this.d2s(s);
      });
      const byCrew = {};
      leaves.forEach(t => {
        const c = String(t.crew || "").trim();
        if (!c || t.milestone || !(t.days > 0)) return;
        (byCrew[c] = byCrew[c] || []).push(t);
      });
      Object.keys(byCrew).forEach(c => {
        const list = byCrew[c].sort((a, b) => this.s2d(a.start) - this.s2d(b.start));
        let end = -Infinity;
        list.forEach(t => {
          let s = this.s2d(t.start);
          if (s < end) s = end;
          t.start = this.d2s(s);
          end = s + Math.max(t.days, 0) * DAY;
        });
      });
    }
    this.setState({ tasks: ts });
  }

  csv() {
    const ts = this.state.tasks, st = this.struct(ts);
    const rows = [["項次", "工項名稱", "班組", "工作面", "開始日期", "工期(天)", "前置項次", "里程碑"]];
    ts.forEach(t => rows.push([st.label[t.id], t.name, t.crew || "", t.face || "", t.start, t.days,
      (t.deps || []).map(d => st.label[d]).filter(Boolean).join(" "), t.milestone ? "Y" : ""]));
    return rows.map(r => r.map(c => /[",\n]/.test(String(c)) ? '"' + String(c).replace(/"/g, '""') + '"' : c).join(",")).join("\r\n");
  }
  download(blob, name) {
    const u = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href = u; a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(u), 3000);
  }
  parseCsv(text) {
    const lines = text.replace(/^\ufeff/, "").split(/\r?\n/).filter(l => l.trim());
    const out = [];
    lines.forEach((l, i) => {
      const c = []; let cur = "", q = false;
      for (let k = 0; k < l.length; k++) {
        const ch = l[k];
        if (q) { if (ch === '"' && l[k + 1] === '"') { cur += '"'; k++; } else if (ch === '"') q = false; else cur += ch; }
        else if (ch === '"') q = true; else if (ch === ",") { c.push(cur); cur = ""; } else cur += ch;
      }
      c.push(cur);
      const lab = (c[0] || "").trim();
      if (!/^\d+(\.\d+){0,2}$/.test(lab)) return;
      const days = parseInt(c[5], 10) || 0;
      out.push({
        id: "i" + i + Date.now(), _lab: lab, level: (lab.match(/\./g) || []).length,
        name: c[1] || "工項", crew: (c[2] || "").trim(), face: (c[3] || "").trim(),
        start: (c[4] || "").trim(), days: days, _deps: (c[6] || "").trim(),
        milestone: /y|是/i.test(c[7] || ""),
      });
    });
    const byLab = {}; out.forEach(t => byLab[t._lab] = t.id);
    out.forEach(t => {
      t.deps = t._deps ? t._deps.split(/[\s,、]+/).map(n => byLab[n.trim()]).filter(Boolean) : [];
      delete t._deps; delete t._lab;
    });
    return out.filter(t => /^\d{4}-\d{2}-\d{2}$/.test(t.start));
  }

  draw() {
    const m = this.model(), px = PX[this.state.scale], c = this.cols(m, px), st = m.st;
    const disp = this.dispList(m), C = this.state.cols || {};
    const wd = this.state.timeMode === "wd";
    const cd = [{ k: "no", w: 54, t: "項次" }, { k: "name", w: 252, t: "工項名稱" }];
    if (C.crew) cd.push({ k: "crew", w: 74, t: "班組" });
    if (C.face) cd.push({ k: "face", w: 84, t: "工作面" });
    if (C.start) cd.push({ k: "start", w: 92, t: wd ? "開始（第N天）" : "開始日期" });
    if (C.days) cd.push({ k: "days", w: 56, t: "工期", r: true });
    if (C.deps) cd.push({ k: "deps", w: 72, t: "前置" });
    let cx = 12; cd.forEach(d => { d.x = cx; cx += d.w; });
    const LW = cx + 12, HH = 52, S = 2;
    const W = LW + c.width, H = HH + Math.max(1, disp.length) * ROW + 24;
    const cv = document.createElement("canvas");
    cv.width = W * S; cv.height = H * S;
    const g = cv.getContext("2d"); g.scale(S, S);
    g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, H);
    g.font = '500 13px Inter, "Noto Sans TC", sans-serif'; g.fillStyle = "#1b1d25";
    g.fillText(this.state.title, 12, 20);
    g.font = '11px Inter, "Noto Sans TC", sans-serif';
    g.fillStyle = "#5f6371";
    cd.forEach(d => {
      if (d.r) { g.textAlign = "right"; g.fillText(d.t, d.x + d.w - 6, HH - 8); g.textAlign = "left"; }
      else g.fillText(d.t, d.x, HH - 8);
    });
    c.top.forEach(t => { g.fillStyle = "#4b4e5b"; g.fillText(t.label, LW + Math.max(0, t.left) + 5, 18); });
    c.bot.forEach(b => {
      if (b.left < 0) return; // 起始月份的格線會落到左側表格裡，不畫
      g.fillStyle = "#b9bdc9"; g.fillRect(LW + b.left, HH, 1, H - HH - 24);
      if (b.width > 12 && b.label) { g.fillStyle = "#5f6371"; g.textAlign = "center"; g.fillText(b.label, LW + b.left + b.width / 2, HH - 8); g.textAlign = "left"; }
    });
    g.strokeStyle = "#c9cdda"; g.beginPath(); g.moveTo(0, HH); g.lineTo(W, HH); g.stroke();
    const x = ms => LW + (ms - m.t0) / DAY * px;

    const sMs = {}, eMs = {};
    m.tasks.forEach(t => {
      if ((st.kids[t.id] || []).length) { const r = this.roll(st.leaves(t.id)); sMs[t.id] = r.start; eMs[t.id] = r.end; }
      else { sMs[t.id] = this.s2d(t.start); eMs[t.id] = this.s2d(t.start) + Math.max(t.days, 0) * DAY; }
    });
    const pos = {}; disp.forEach((d, i) => pos[d.t.id] = i);
    const cell = (d, txt, y, color, font) => {
      if (!d) return;
      g.fillStyle = color; g.font = font;
      const s = String(txt == null ? "" : txt);
      if (d.r) { g.textAlign = "right"; g.fillText(s, d.x + d.w - 6, y); g.textAlign = "left"; }
      else g.fillText(s, d.x, y);
    };
    const col = k => cd.filter(d => d.k === k)[0];

    disp.forEach((d, i) => {
      const t = d.t, y = HH + i * ROW, yt = y + 22;
      const lv = st.lv[t.id], kids = st.kids[t.id] || [];
      const summary = kids.length > 0;
      const r0 = summary ? this.roll(st.leaves(t.id)) : null;
      g.strokeStyle = "#b9bdc9"; g.beginPath(); g.moveTo(0, y + ROW); g.lineTo(W, y + ROW); g.stroke();
      if (lv === 0) { g.fillStyle = "#f2f3f8"; g.fillRect(0, y, W, ROW); }
      const ink = lv === 0 ? "#1b1d25" : lv === 1 ? "#3a3260" : "#1b1d25";
      const nf = summary ? '500 12px Inter, "Noto Sans TC", sans-serif' : '12px Inter, "Noto Sans TC", sans-serif';
      cell(col("no"), st.label[t.id], yt, "#6e7280", '11px Inter, "Noto Sans TC", sans-serif');
      const nc = col("name");
      if (nc) { g.fillStyle = ink; g.font = nf; g.fillText(t.name, nc.x + lv * 14, yt); }
      const small = '11px Inter, "Noto Sans TC", sans-serif';
      cell(col("crew"), t.crew || "", yt, "#5f6371", small);
      cell(col("face"), t.face || "", yt, "#5f6371", small);
      const sTxt = wd ? String(Math.round((sMs[t.id] - m.min) / DAY) + 1) : this.d2s(sMs[t.id]);
      cell(col("start"), sTxt, yt, "#5f6371", small);
      cell(col("days"), (summary ? r0.days : (t.days || 0)) + " 天", yt, "#5f6371", small);
      cell(col("deps"), (t.deps || []).map(k => st.label[k]).filter(Boolean).join("、"), yt, "#8b8fa0", small);

      if (summary) {
        const gx = x(r0.start), gw = Math.max(4, (r0.end - r0.start) / DAY * px);
        g.fillStyle = lv === 0 ? "#1b1d25" : "#9c92de";
        g.beginPath(); g.roundRect(gx, y + 13, gw, lv === 0 ? 10 : 9, 2); g.fill();
        return;
      }
      const bx = x(this.s2d(t.start));
      if (t.milestone) { g.save(); g.translate(bx + 7, y + ROW / 2); g.rotate(Math.PI / 4); g.fillStyle = "#4f4581"; g.fillRect(-6, -6, 12, 12); g.restore(); }
      else {
        const w = Math.max(3, t.days * px);
        g.fillStyle = t.crew ? this.crewColor(t.crew) : "#8b8fa0";
        g.beginPath(); g.roundRect(bx, y + 8, w, 17, 4); g.fill();
        if (m.crit[t.id]) { g.strokeStyle = "#221d3a"; g.lineWidth = 1.2; g.beginPath(); g.roundRect(bx, y + 8, w, 17, 4); g.stroke(); }
        g.fillStyle = "#5f6371"; g.font = small;
        g.fillText(t.days + " 天", bx + w + 8, yt);
      }
    });

    // 相依連接線
    if (C.arrows) {
      g.lineWidth = 1.1;
      m.tasks.forEach(t => (t.deps || []).forEach(dep => {
        const p = m.byId[dep]; if (!p) return;
        const i = pos[t.id], j = pos[dep];
        if (i == null || j == null) return;
        const x1 = x(eMs[dep]) + (p.milestone ? 15 : 0), y1 = HH + j * ROW + ROW / 2;
        const x2 = x(sMs[t.id]), y2 = HH + i * ROW + ROW / 2;
        const sameCrew = String(t.crew || "").trim() && String(t.crew || "").trim() === String(p.crew || "").trim();
        g.strokeStyle = sameCrew ? this.crewColor(t.crew) : (m.crit[t.id] && m.crit[dep] ? "#6455a8" : "#b9bdc9");
        g.fillStyle = g.strokeStyle;
        g.beginPath();
        g.moveTo(x1, y1);
        if (x2 - x1 > 16) { g.lineTo(x2 - 9, y1); g.lineTo(x2 - 9, y2); g.lineTo(x2 - 3, y2); }
        else {
          const yMid = y2 + (y2 > y1 ? -ROW / 2 : ROW / 2);
          g.lineTo(x1 + 8, y1); g.lineTo(x1 + 8, yMid); g.lineTo(x2 - 9, yMid); g.lineTo(x2 - 9, y2); g.lineTo(x2 - 3, y2);
        }
        g.stroke();
        g.beginPath();
        g.moveTo(x2 - 3, y2); g.lineTo(x2 - 9, y2 - 3.5); g.lineTo(x2 - 9, y2 + 3.5);
        g.closePath(); g.fill();
      }));
    }
    return cv;
  }

  renderVals() {

    const pos = {}; disp.forEach((d, i) => pos[d.t.id] = i);

    const wd = this.state.timeMode === "wd";
    const C = this.state.cols || {};

    const rows = disp.map((d, di) => {
      const t = d.t, i = di;

        start: summary ? this.d2s(r0.start) : t.start,
        dateKey: t.id + "|" + (summary ? this.d2s(r0.start) : t.start),
        startDay: Math.round((startMs - m.min) / DAY) + 1,
        days: days, depsStr: (t.deps || []).map(k => st.label[k]).filter(Boolean).join(","),
        depsLabel: (t.deps || []).map(k => st.label[k]).filter(Boolean).join("、") || "— 選擇前置 —",
        depTip: (t.deps || []).map(k => st.label[k] + " " + (m.byId[k] ? m.byId[k].name : "")).join("\n") || "從清單勾選前置工項；再選一次可取消",
        depPick: "",
        depOptions: m.tasks.filter(o => {
          if (o.id === t.id) return false;

        }).map(o => ({

        })),
        onDepPick: e => {

          this.patch(t.id, { deps: cur });
        },
        top: i * ROW, left: x(startMs), width: barW,
        color: t.milestone ? "var(--color-accent-300)" : (t.crew ? cc : "var(--color-neutral-600)"),
        glow: critical ? "0 0 0 1.5px var(--color-accent-200)" : "none",
        rollH: lv === 0 ? 10 : 9,

        rollFill: lv === 0 ? "var(--color-neutral-200)" : "var(--color-accent-600)",
        labelColor: critical ? "var(--color-accent-200)" : "var(--color-neutral-500)",
        barLabel: t.milestone && !summary ? t.name : (days + " 天"),
        flagColor: t.milestone ? "var(--color-accent-300)" : "var(--color-neutral-700)",
        tip: st.label[t.id] + " " + t.name + "　" + (t.crew ? t.crew + "　" : "") + (summary ? this.d2s(r0.start) : t.start) + "　" + days + " 天" + (critical ? "　(要徑)" : ""),
        onName: e => this.patch(t.id, { name: e.target.value }),
        onCrew: e => this.patch(t.id, { crew: e.target.value }),
        onFace: e => this.patch(t.id, { face: e.target.value }),
        onProgress: e => this.patch(t.id, { progress: Math.max(0, Math.min(100, parseInt(e.target.value, 10) || 0)) }),
        onStartText: e => {
          const iso = this.parseDate(e.target.value);
          if (iso) this.patch(t.id, { start: iso });
          else e.target.value = summary ? this.d2s(r0.start) : t.start;
        },
        onStartKey: e => { if (e.key === "Enter") e.target.blur(); },
        onStartDay: e => {
          const n = Math.max(1, parseInt(e.target.value, 10) || 1);
          this.patch(t.id, { start: this.d2s(m.min + (n - 1) * DAY) });
        },
        onDays: e => this.patch(t.id, { days: Math.max(0, parseInt(e.target.value, 10) || 0) }),
        onDeps: e => {
          const ids = e.target.value.split(/[^\d.]+/).filter(Boolean).map(n => byLabel[n]).filter(p => p && p !== t.id);
          this.patch(t.id, { deps: ids });
        },
        onToggle: () => this.setState(s => {
          const c2 = Object.assign({}, s.collapsed);
          if (c2[t.id]) delete c2[t.id]; else c2[t.id] = 1;
          return { collapsed: c2 };
        }),
        onIn: () => this.patch(t.id, { level: Math.min(2, lv + 1) }),
        onOut: () => this.patch(t.id, { level: Math.max(0, lv - 1) }),
        onFlag: () => this.patch(t.id, { milestone: !t.milestone, days: t.milestone ? Math.max(1, t.days) : 0 }),
        onDelete: () => {
          const drop = {}; drop[t.id] = 1;
          st.leaves(t.id).forEach(k => drop[k.id] = 1);
          (st.kids[t.id] || []).forEach(k => drop[k.id] = 1);
          this.setTasks(ts => ts.filter(o => !drop[o.id]).map(o => Object.assign({}, o, { deps: (o.deps || []).filter(k => !drop[k]) })));
        },
        onRowDrag: e => this.startRowDrag(e, t.id),
        onMove: e => this.startDrag(e, t.id, "move"),
        onResizeL: e => this.startDrag(e, t.id, "l"),
        onResizeR: e => this.startDrag(e, t.id, "r"),
      };
    });

    const sMs = {}, eMs = {};
    m.tasks.forEach(t => {
      if ((st.kids[t.id] || []).length) { const r = this.roll(st.leaves(t.id)); sMs[t.id] = r.start; eMs[t.id] = r.end; }
      else { sMs[t.id] = this.s2d(t.start); eMs[t.id] = this.s2d(t.start) + Math.max(t.days, 0) * DAY; }
    });
    const arrows = [];
    m.tasks.forEach(t => (t.deps || []).forEach(dep => {
      const p = m.byId[dep]; if (!p) return;
      const i = pos[t.id], j = pos[dep];
      if (i == null || j == null) return;
      const x1 = x(eMs[dep]) + (p.milestone ? 15 : 0);
      const y1 = j * ROW + ROW / 2;
      const x2 = x(sMs[t.id]), y2 = i * ROW + ROW / 2;
      const sameCrew = String(t.crew || "").trim() && String(t.crew || "").trim() === String(p.crew || "").trim();
      const gap = 9;
      const dpath = x2 - x1 > 16
        ? "M" + x1 + " " + y1 + " H" + (x2 - gap) + " V" + y2 + " H" + (x2 - 3)
        : "M" + x1 + " " + y1 + " h8 V" + (y2 - (y2 > y1 ? ROW / 2 : -ROW / 2)) + " H" + (x2 - gap) + " V" + y2 + " H" + (x2 - 3);
      arrows.push({
        d: dpath,
        color: sameCrew ? this.crewColor(t.crew) : (m.crit[t.id] && m.crit[dep] ? "var(--color-accent-400)" : "var(--color-neutral-700)"),
        head: (x2 - 3) + "," + y2 + " " + (x2 - 9) + "," + (y2 - 3.5) + " " + (x2 - 9) + "," + (y2 + 3.5),
      });
    }));

    const crews = [];
    m.tasks.forEach(t => { const k = String(t.crew || "").trim(); if (k && crews.indexOf(k) < 0) crews.push(k); });
    const leafTasks = m.tasks.filter(t => (st.kids[t.id] || []).length === 0);
    const wsum = leafTasks.reduce((a, t) => a + Math.max(t.days, 0), 0);
    const overall = wsum ? Math.round(leafTasks.reduce((a, t) => a + Math.max(t.days, 0) * (t.progress || 0), 0) / wsum) : 0;
    const total = Math.round((m.max - m.min) / DAY);
    const g = this.state.ghost;

    return {
      title: this.state.title,
      onTitle: e => this.setState({ title: e.target.value }),
      currentProjectName: this.state.title || "專案",
      showProjects: !!this.state.showProjects,
      toggleProjects: () => this.setState(s => ({ showProjects: !s.showProjects })),
      addProject: () => this.addProject(),
      projectRows: (this.state.projects || []).map((p, i) => ({
        name: p.name,
        onRename: e => this.renameProject(p.id, e.target.value),
        onPick: () => this.switchProject(p.id),
        pickCls: p.id === this.state.currentProjectId ? "btn-primary" : "btn-secondary",
        pickLabel: p.id === this.state.currentProjectId ? "使用中" : "切換",
        weight: p.id === this.state.currentProjectId ? "500" : "400",
        nameColor: p.id === this.state.currentProjectId ? "var(--color-accent-300)" : "var(--color-text)",
        onUp: () => this.moveProject(p.id, -1),
        onDown: () => this.moveProject(p.id, 1),
        upVis: i === 0 ? "hidden" : "visible",
        downVis: i === this.state.projects.length - 1 ? "hidden" : "visible",
        onDelete: () => { if (confirm("刪除專案「" + p.name + "」？此動作無法復原。")) this.deleteProject(p.id); },
        delVis: this.state.projects.length > 1 ? "visible" : "hidden",
      })),
      rows: rows, arrows: arrows, topCells: c.top, botCells: c.bot,
      chartW: Math.round(c.width), chartH: Math.max(1, disp.length + 1) * ROW,
      todayX: x(this.s2d(this.d2s(Date.now()))),
      startHead: wd ? "開始（第N天）" : "開始日期",
      crewLegend: crews.map(n => ({ name: n, color: this.crewColor(n) })),
      summary: leafTasks.length + " 項工項 · " + crews.length + " 個班組 · 總工期 " + total + " 天 · " + this.d2s(m.min) + " → " + this.d2s(m.max),
      colArrows: !!C.arrows,
      colCrew: !!C.crew, colFace: !!C.face, colStart: !!C.start, colDays: !!C.days, colDeps: !!C.deps,
      clsCrew: C.crew ? "btn-primary" : "btn-secondary",
      clsFace: C.face ? "btn-primary" : "btn-secondary",
      clsStart: C.start ? "btn-primary" : "btn-secondary",
      clsDays: C.days ? "btn-primary" : "btn-secondary",
      clsDeps: C.deps ? "btn-primary" : "btn-secondary",
      clsArrow: C.arrows ? "btn-primary" : "btn-secondary",
      toggleCrew: () => this.toggleCol("crew"),
      toggleFace: () => this.toggleCol("face"),
      toggleStart: () => this.toggleCol("start"),
      toggleDays: () => this.toggleCol("days"),
      toggleDeps: () => this.toggleCol("deps"),
      toggleArrows: () => this.toggleCol("arrows"),
      panelW: 24 + 18 + 52 + 250 + 86 + (C.crew ? 78 : 0) + (C.face ? 84 : 0) + (C.start ? 108 : 0) + (C.days ? 58 : 0) + (C.deps ? 118 : 0),
      isDay: sc === "day", isWeek: sc === "week", isMonth: sc === "month",
      setDay: () => this.setState({ scale: "day" }), setWeek: () => this.setState({ scale: "week" }), setMonth: () => this.setState({ scale: "month" }),
      isCal: !wd, isWd: wd,
      setCal: () => this.setState({ timeMode: "date" }), setWd: () => this.setState({ timeMode: "wd" }),
      addTask: () => this.addTask(false), addMilestone: () => this.addTask(true),
      levelCrews: () => this.levelCrews(),
      showTpl: !!this.state.showTpl,
      openTpl: () => this.setState({ showTpl: true }),
      closeTpl: () => this.setState({ showTpl: false }),
      addZone: () => this.addZone(),
      newZoneName: this.state.newZoneName,
      newZoneCrew: this.state.newZoneCrew,
      onNewZoneName: e => this.setState({ newZoneName: e.target.value }),
      onNewZoneCrew: e => this.setState({ newZoneCrew: e.target.value }),
      addStep: () => this.setState(s => ({ steps: s.steps.concat([{ name: "新工序", days: 5 }]) })),
      steps: this.state.steps.map((s, i) => ({
        name: s.name, days: s.days,
        onName: e => { const v = e.target.value; this.setState(p => ({ steps: p.steps.map((o, k) => k === i ? { name: v, days: o.days } : o) })); },
        onDays: e => { const v = Math.max(0, parseInt(e.target.value, 10) || 0); this.setState(p => ({ steps: p.steps.map((o, k) => k === i ? { name: o.name, days: v } : o) })); },
        onDel: () => this.setState(p => ({ steps: p.steps.filter((o, k) => k !== i) })),
      })),
      gridRef: el => { if (el) this.gridEl = el; },
      tableRef: el => { if (el) this.tableEl = el; },
      scrollRef: el => { if (el) this.scrollEl = el; },
      fileRef: el => { if (el) this.fileEl = el; },
      onGridDown: e => this.onGridDown(e),
      ghostShow: g ? "block" : "none",
      ghostTop: g ? g.top + 8 : 0,
      ghostLeft: g ? Math.min(g.x0, g.x1) - (g.originX || 0) : 0,
      ghostW: g ? Math.abs(g.x1 - g.x0) : 0,
      syncLabel: this.state.sync === "live"
        ? "即時協作 · 房號 " + this.room + " · " + (this.state.peers || 1) + " 人在線"
        : this.state.sync === "off" ? "離線（僅存本機）" : "連線中…",
      syncTip: this.state.sync === "live" ? "此排程已同步到 Firebase，按『共用連結』把房號傳給同事即可共同編輯。" : "目前僅儲存在這台電腦。",
      exportCsv: () => this.download(new Blob(["\ufeff" + this.csv()], { type: "text/csv;charset=utf-8" }), (this.state.title || "gantt") + ".csv"),
      importCsv: () => this.fileEl && this.fileEl.click(),
      onFile: e => {
        const f = e.target.files && e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          const ts = this.parseCsv(String(r.result));
          if (ts && ts.length) this.setState({ tasks: ts });
          else alert("無法解析此 CSV，請使用『匯出 CSV』的欄位格式。");
        };
        r.readAsText(f, "utf-8"); e.target.value = "";
      },
      exportPng: () => { this.draw().toBlob(b => this.download(b, (this.state.title || "gantt") + ".png")); },
      exportPdf: () => {
        const url = this.draw().toDataURL("image/png");
        const w = window.open("", "_blank");
        if (!w) return;
        w.document.write('<html><head><title>' + this.state.title + '</title><style>@page{size:A3 landscape;margin:10mm}body{margin:0;background:#fff}img{width:100%}</style></head><body><img src="' + url + '"></body></html>');
        w.document.close();
        w.onload = () => setTimeout(() => w.print(), 300);
      },
      share: () => {
        const url = location.origin + location.pathname + location.search + (this.room ? "#r=" + this.room : "");
        const done = () => alert("共用連結已複製：\n" + url + "\n\n同事開啟後即可與你同步編輯同一份排程。");
        if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, done); else done();
      },
    };
  }
}

</script>
</body>
</html>
